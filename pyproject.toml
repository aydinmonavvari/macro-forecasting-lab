[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-forecasting-lab"
version = "1.0.0"
description = "Forecasting US macroeconomic indicators (inflation, unemployment) with classical statistical and ML models under strict chronological out-of-sample validation."
readme = "README.md"
authors = [{ name = "Aydin Monavvari", email = "245710241+aydinmonavvari@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["macroeconomics", "forecasting", "time-series", "machine-learning", "fred"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/aydinmonavvari/macro-forecasting-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
